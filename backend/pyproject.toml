[project]
name = "astro-brain-backend"
version = "0.1.0dev"
description = "FastAPI backend for Astro-Brain (Celestron mount + GPS control)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "aiosqlite>=0.20",
    "numpy>=2.0",
]

[project.optional-dependencies]
hardware = [
    "pyindi-client>=2.0",
    "gpsd-py3",
    "smbus2>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["astro_brain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in default args is idiomatic — B008 is a known false-positive here.
"astro_brain/routes/*.py" = ["B008"]
