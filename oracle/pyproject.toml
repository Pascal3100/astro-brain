[project]
name = "oracle"
version = "0.1.0"
description = "Astro-Brain reference data generator (comets, events) -> reference.sqlite"
requires-python = ">=3.13"
dependencies = [
    "skyfield>=1.49",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]
