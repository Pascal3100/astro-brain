[project]
name = "oracle"
version = "0.1.0"
description = "Astro-Brain reference data generator (comets, events) -> reference.sqlite"
requires-python = ">=3.13"
dependencies = [
    "skyfield>=1.49",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]
